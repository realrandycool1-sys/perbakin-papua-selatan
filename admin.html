<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — PERBAKIN Papua Selatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
<style>
.empty-state { text-align: center; padding: 60px 24px; color: var(--muted); }
.pic-preview { width: 60px; height: 50px; border-radius: 6px; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div class="logo" style="flex-direction: column; gap: 16px;">
      <img src="assets/logo.png" alt="PERBAKIN Papua Selatan" class="logo-img" style="height: 100px;" />
      <div class="logo-text text-center">
        <div class="logo-name">Admin Panel</div>
        <div class="logo-sub">PERBAKIN Papua Selatan</div>
      </div>
    </div>
    <h2>Login Admin</h2>
    <p>Hubungi ketua untuk kredensial admin</p>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" class="form-input" id="login-user" value="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-input" id="login-pass" placeholder="Masukkan password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">🔐 Login</button>
    </form>
  </div>
</div>

<!-- ADMIN LAYOUT -->
<div id="admin-layout" class="admin-layout" style="display: none;">
  <aside class="admin-sidebar">
    <a href="index.html" class="logo" style="margin-bottom: 8px;">
      <img src="assets/logo.png" alt="PERBAKIN Papua Selatan" class="logo-img" />
    </a>
    <div style="padding: 0 14px 16px; border-bottom: 1px solid #1e293b; margin-bottom: 16px;">
      <div class="logo-name" style="color: #fff; font-size: 13px;">Admin Panel</div>
      <div class="logo-sub" style="color: rgba(255,255,255,0.5);">PERBAKIN Papua Selatan</div>
    </div>
    <nav class="admin-nav">
      <a href="#" class="active" data-page="dashboard" onclick="showPage('dashboard')">📊 Dashboard</a>
      <a href="#" data-page="berita" onclick="showPage('berita')">📰 Berita</a>
      <a href="#" data-page="klub" onclick="showPage('klub')">🎯 Klub</a>
      <a href="#" data-page="pengurus" onclick="showPage('pengurus')">👥 Pengurus</a>
      <a href="#" data-page="pengumuman" onclick="showPage('pengumuman')">📢 Pengumuman</a>
      <a href="#" data-page="galeri" onclick="showPage('galeri')">🖼️ Galeri</a>
      <a href="#" data-page="kontak" onclick="showPage('kontak')">📞 Info Kontak</a>
      <a href="#" data-page="pendaftar" onclick="showPage('pendaftar')">👤 Pendaftar</a>
      <a href="#" data-page="pesan" onclick="showPage('pesan')">✉️ Pesan Masuk</a>
      <a href="#" data-page="settings" onclick="showPage('settings')">⚙️ Pengaturan</a>
      <a href="index.html" style="margin-top: 24px;">← Kembali ke Website</a>
      <a href="#" onclick="doLogout()">🚪 Logout</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div id="admin-content"></div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
let currentPage = 'dashboard';
const PIC_OPTIONS = ['pic-grad-1', 'pic-grad-2', 'pic-grad-3', 'pic-grad-4', 'pic-grad-5', 'pic-grad-6', 'pic-grad-7', 'pic-grad-8'];

function doLogin(e) {
  e.preventDefault();
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;

  const ADMIN_USER = 'admin';
  const ADMIN_PASS = '111';

  if (user !== ADMIN_USER || pass !== ADMIN_PASS) {
    showToast('Username atau password salah', 'error');
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
    return;
  }

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-layout').style.display = 'grid';
  showPage('dashboard');
  showToast('Login berhasil!', 'success');
}

function doLogout() {
  if (confirm('Yakin ingin logout?')) {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('admin-layout').style.display = 'none';
  }
}

function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.admin-nav a').forEach(a => a.classList.remove('active'));
  const activeBtn = document.querySelector(`[data-page="${page}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  const renderers = {
    dashboard: renderDashboard,
    berita: renderBeritaAdmin,
    klub: renderKlubAdmin,
    pengurus: renderPengurusAdmin,
    pengumuman: renderPengumumanAdmin,
    galeri: renderGaleriAdmin,
    kontak: renderKontakAdmin,
    pendaftar: renderPendaftarAdmin,
    pesan: renderPesanAdmin,
    settings: renderSettings
  };
  const fn = renderers[page] || renderDashboard;
  document.getElementById('admin-content').innerHTML = fn();
}

// DASHBOARD
function renderDashboard() {
  const berita = getData('berita');
  const klub = getData('klub');
  const pengumuman = getData('pengumuman');
  const pengurus = getData('pengurus');
  const pendaftar = JSON.parse(localStorage.getItem('perbakin_pendaftar') || '[]');
  const messages = JSON.parse(localStorage.getItem('perbakin_messages') || '[]');

  const totalAtlet = klub.reduce((sum, k) => sum + k.atlet, 0);
  const totalViews = berita.reduce((sum, b) => sum + (b.views || 0), 0);

  return `
    <div class="admin-header">
      <h1>Dashboard</h1>
      <div style="font-size: 13px; color: var(--muted);">Selamat datang di panel admin</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total Berita</div>
        <div class="num">${berita.length}</div>
        <div class="change">↑ ${berita.length} published</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Klub</div>
        <div class="num">${klub.length}</div>
        <div class="change">${klub.filter(k => k.status === 'Aktif').length} aktif</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Atlet</div>
        <div class="num">${totalAtlet}</div>
        <div class="change">${klub.length} klub</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Views</div>
        <div class="num">${totalViews}</div>
        <div class="change">↑ Views artikel</div>
      </div>
      <div class="stat-card">
        <div class="label">Pendaftar Baru</div>
        <div class="num">${pendaftar.length}</div>
        <div class="change">${pendaftar.filter(p => p.status === 'Baru').length} perlu diproses</div>
      </div>
      <div class="stat-card">
        <div class="label">Pesan Masuk</div>
        <div class="num">${messages.length}</div>
        <div class="change">${messages.filter(m => m.status === 'Baru').length} belum dibaca</div>
      </div>
      <div class="stat-card">
        <div class="label">Pengurus</div>
        <div class="num">${pengurus.length}</div>
        <div class="change">Periode 2023-2027</div>
      </div>
      <div class="stat-card">
        <div class="label">Pengumuman</div>
        <div class="num">${pengumuman.length}</div>
        <div class="change">PDF aktif</div>
      </div>
    </div>

    <div style="background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border-radius: 12px; padding: 24px; margin-bottom: 24px;">
      <h3 class="serif" style="font-size: 22px; margin-bottom: 8px; font-weight: 400;">👋 Selamat Datang di Admin Panel</h3>
      <p style="font-size: 14px; opacity: 0.9;">Kelola berita, klub, pengurus, pengumuman, dan galeri dari sini. Semua perubahan akan tersimpan di browser dan langsung terlihat di website publik.</p>
    </div>

    <h3 style="font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 16px;">Berita Terbaru</h3>
    <table class="admin-table">
      <thead><tr><th>Gambar</th><th>Judul</th><th>Kategori</th><th>Tanggal</th><th>Views</th></tr></thead>
      <tbody>
        ${berita.slice(0, 5).map(b => `
          <tr>
            <td><div class="row-img ${b.pic}"></div></td>
            <td><strong>${b.judul.substring(0, 50)}${b.judul.length > 50 ? '...' : ''}</strong></td>
            <td><span class="tag tag-red-soft">${b.kategori}</span></td>
            <td>${formatDate(b.tanggal)}</td>
            <td>${b.views || 0}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

// BERITA ADMIN
function renderBeritaAdmin() {
  const berita = getData('berita');
  return `
    <div class="admin-header">
      <h1>Kelola Berita</h1>
      <button class="btn btn-primary" onclick="formBerita()">+ Tambah Berita</button>
    </div>
    <table class="admin-table">
      <thead><tr><th>Gambar</th><th>Judul</th><th>Kategori</th><th>Tanggal</th><th>Views</th><th>Aksi</th></tr></thead>
      <tbody>
        ${berita.length === 0 ? '<tr><td colspan="6" class="empty-state">Belum ada berita. Klik "+ Tambah Berita" untuk mulai.</td></tr>' : berita.map(b => `
          <tr data-id="${b.id}">
            <td><div class="row-img ${b.cover ? '' : (b.pic || 'pic-grad-1')}" style="${b.cover && b.cover.data ? 'background-image: url(\'' + b.cover.data + '\'); background-size: cover; background-position: center;' : ''}">${b.externalUrl ? '<div style="position: absolute; top: 2px; right: 2px; background: #f59e0b; color: #fff; font-size: 9px; padding: 1px 4px; border-radius: 3px;">🔗</div>' : ''}</div></td>
            <td><strong>${b.judul.substring(0, 50)}${b.judul.length > 50 ? '...' : ''}</strong>${b.externalUrl ? ' <span style="font-size: 10px; color: #f59e0b;">📰 ' + (b.source || 'eksternal') + '</span>' : ''}</td>
            <td><span class="tag tag-red-soft">${b.kategori}</span></td>
            <td>${formatDate(b.tanggal)}</td>
            <td>${b.views || 0}</td>
            <td>
              <button class="btn btn-sm btn-outline" onclick="formBerita(${b.id})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="hapusItem('berita', ${b.id})">Hapus</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function formBerita(id = null) {
  const item = id ? getData('berita').find(b => b.id === id) : {};
  const hasExternal = !!item.externalUrl;
  const content = `
    <div class="modal-header">
      <h3>${id ? 'Edit' : 'Tambah'} Berita</h3>
      <button onclick="closeModal()" style="font-size: 24px;">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Judul *</label>
        <input type="text" class="form-input" id="modal-judul" value="${item.judul || ''}" required>
      </div>
      <div class="form-group">
        <label>Kategori *</label>
        <select class="form-select" id="modal-kategori">
          <option ${item.kategori === 'Kegiatan' ? 'selected' : ''}>Kegiatan</option>
          <option ${item.kategori === 'Prestasi' ? 'selected' : ''}>Prestasi</option>
          <option ${item.kategori === 'Pelatihan' ? 'selected' : ''}>Pelatihan</option>
          <option ${item.kategori === 'Pengumuman' ? 'selected' : ''}>Pengumuman</option>
          <option ${item.kategori === 'Regulasi' ? 'selected' : ''}>Regulasi</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tanggal *</label>
        <input type="date" class="form-input" id="modal-tanggal" value="${item.tanggal || new Date().toISOString().split('T')[0]}" required>
      </div>
      <div class="form-group" style="background: #fef9e7; padding: 12px; border-radius: 8px; border: 1px solid #f59e0b;">
        <label style="display: flex; align-items: center; gap: 8px; color: #92400e;">
          <input type="checkbox" id="modal-is-external" ${hasExternal ? 'checked' : ''} onchange="toggleExternalFields(this.checked)">
          <strong>🔗 Berita ini link ke website lain (sumber eksternal)</strong>
        </label>
        <div id="external-fields" style="margin-top: 10px; ${hasExternal ? '' : 'display:none;'}">
          <label style="font-size: 13px;">URL Berita Asal *</label>
          <input type="url" class="form-input" id="modal-external-url" value="${item.externalUrl || ''}" placeholder="https://www.kompas.com/..." oninput="previewExternalSource(this)">
          <div id="preview-external-source" style="margin-top: 6px; font-size: 12px; color: var(--muted);">
            ${item.externalUrl ? `Sumber: <strong>${getSourceFromUrl(item.externalUrl) || 'Tidak dikenali'}</strong>` : 'Paste URL lengkap, sumber akan otomatis terdeteksi (misal: kompas.com → "Kompas.com")'}
          </div>
          <div style="margin-top: 6px; font-size: 11px; color: #92400e;">
            💡 Kalau dicentang, field "Konten Lengkap" di bawah jadi opsional (pengunjung akan diarahkan ke website asal saat klik).
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Excerpt (Ringkasan) *</label>
        <textarea class="form-textarea" id="modal-excerpt" style="min-height: 60px;" required>${item.excerpt || ''}</textarea>
      </div>
      <div class="form-group" id="content-group">
        <label>Konten Lengkap <span id="content-required-mark">*</span></label>
        <textarea class="form-textarea" id="modal-content">${item.content || ''}</textarea>
        <div class="form-hint">Pisahkan paragraf dengan baris kosong (enter 2x)</div>
      </div>
      <div class="form-group">
        <label>Cover (Gambar / Video)</label>
        <input type="file" class="form-input" id="modal-cover" accept="image/*,video/*" onchange="previewBeritaCover(this)">
        <div id="preview-cover" style="margin-top: 8px; ${item.cover ? '' : 'display:none;'}">
          ${item.cover ? renderCoverPreview(item.cover) : ''}
        </div>
        <details style="margin-top: 8px; font-size: 12px;">
          <summary style="cursor: pointer; color: var(--muted);">Atau pilih gradient bawaan (backward compat)</summary>
          <select class="form-select" id="modal-pic" style="margin-top: 8px;">
            <option value="">— Tidak pakai gradient —</option>
            ${PIC_OPTIONS.map(p => `<option value="${p}" ${item.pic === p ? 'selected' : ''}>${p.replace('pic-grad-', 'Gradient ')}</option>`).join('')}
          </select>
        </details>
        <div class="form-hint" style="margin-top: 6px;">
          Gambar maks 5MB, Video maks 50MB. File disimpan sebagai base64. Upload baru = replace cover lama.
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="simpanBerita(${id || 'null'})">💾 Simpan</button>
    </div>
  `;
  showModal(content);
  // Sinkronkan required state saat buka modal
  if (hasExternal) {
    const ta = document.getElementById('modal-content');
    if (ta) ta.removeAttribute('required');
    const mark = document.getElementById('content-required-mark');
    if (mark) mark.textContent = '(opsional)';
  }
}

function toggleExternalFields(checked) {
  const f = document.getElementById('external-fields');
  const ta = document.getElementById('modal-content');
  const mark = document.getElementById('content-required-mark');
  if (checked) {
    if (f) f.style.display = 'block';
    if (ta) ta.removeAttribute('required');
    if (mark) mark.textContent = '(opsional)';
  } else {
    if (f) f.style.display = 'none';
    if (ta) ta.setAttribute('required', '');
    if (mark) mark.textContent = '*';
  }
}

function previewExternalSource(input) {
  const target = document.getElementById('preview-external-source');
  const url = input.value.trim();
  if (!url) {
    target.textContent = 'Paste URL lengkap, sumber akan otomatis terdeteksi (misal: kompas.com → "Kompas.com")';
    return;
  }
  const source = getSourceFromUrl(url);
  if (source) {
    target.innerHTML = `Sumber: <strong>${source}</strong> ✅`;
  } else {
    target.innerHTML = '⚠️ URL tidak valid';
  }
}

function getSourceFromUrl(url) {
  try {
    const u = new URL(url);
    let host = u.hostname.replace(/^www\./, '');
    // Map popular domains ke nama display
    const map = {
      'kompas.com': 'Kompas.com',
      'detik.com': 'Detik.com',
      'tempo.co': 'Tempo.co',
      'cnnindonesia.com': 'CNN Indonesia',
      'bbc.com': 'BBC',
      'bbc.co.id': 'BBC Indonesia',
      'cnbcindonesia.com': 'CNBC Indonesia',
      'liputan6.com': 'Liputan6',
      'antaranews.com': 'Antara News',
      'republika.co.id': 'Republika',
      'merdeka.com': 'Merdeka.com',
      'suara.com': 'Suara.com',
      'tribunnews.com': 'Tribun News',
      'kumparan.com': 'Kumparan',
      'okezone.com': 'Okezone'
    };
    for (const [key, val] of Object.entries(map)) {
      if (host.includes(key)) return val;
    }
    // Fallback: capitalize first letter
    return host.split('.').slice(-2, -1)[0].charAt(0).toUpperCase() + host.split('.').slice(-2, -1)[0].slice(1);
  } catch (e) {
    return null;
  }
}

function renderCoverPreview(cover) {
  if (!cover || !cover.data) return '';
  if (cover.type && cover.type.startsWith('video')) {
    return `<video src="${cover.data}" controls style="max-width: 100%; max-height: 200px; border-radius: 6px;"></video>
            <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">📹 Cover tersimpan${cover.name ? ' — ' + cover.name : ''}</div>`;
  }
  return `<img src="${cover.data}" style="max-width: 100%; max-height: 200px; border-radius: 6px; border: 1px solid var(--line);">
          <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">🖼️ Cover tersimpan${cover.name ? ' — ' + cover.name : ''}</div>`;
}

function previewBeritaCover(input) {
  const target = document.getElementById('preview-cover');
  const file = input.files[0];
  if (!file) { target.style.display = 'none'; target.innerHTML = ''; return; }
  const isImage = file.type.startsWith('image/');
  const isVideo = file.type.startsWith('video/');
  if (!isImage && !isVideo) {
    showToast('Format harus gambar atau video!', 'error');
    input.value = '';
    return;
  }
  const maxSize = isImage ? 5 * 1024 * 1024 : 50 * 1024 * 1024;
  if (file.size > maxSize) {
    showToast(`Ukuran ${isImage ? 'gambar' : 'video'} terlalu besar! Maks ${isImage ? '5MB' : '50MB'}`, 'error');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    target.style.display = 'block';
    target.innerHTML = renderCoverPreview({ type: file.type, name: file.name, data: e.target.result });
  };
  reader.readAsDataURL(file);
}

function simpanBerita(id) {
  const isExternal = document.getElementById('modal-is-external').checked;
  const data = {
    judul: document.getElementById('modal-judul').value,
    kategori: document.getElementById('modal-kategori').value,
    tanggal: document.getElementById('modal-tanggal').value,
    excerpt: document.getElementById('modal-excerpt').value,
    content: document.getElementById('modal-content').value,
    pic: document.getElementById('modal-pic').value || null
  };
  if (!data.judul || !data.excerpt) {
    showToast('Lengkapi judul dan excerpt!', 'error');
    return;
  }
  if (!isExternal && !data.content) {
    showToast('Konten lengkap wajib untuk berita internal!', 'error');
    return;
  }

  // External link
  if (isExternal) {
    const url = document.getElementById('modal-external-url').value.trim();
    if (!url) {
      showToast('URL berita eksternal wajib diisi!', 'error');
      return;
    }
    if (!getSourceFromUrl(url)) {
      showToast('URL tidak valid!', 'error');
      return;
    }
    data.externalUrl = url;
    data.source = getSourceFromUrl(url);
  } else {
    data.externalUrl = null;
    data.source = null;
  }

  // Existing data (untuk edit)
  const existing = id ? getData('berita').find(b => b.id === id) : null;
  data.cover = existing ? existing.cover : null;

  const coverInput = document.getElementById('modal-cover');

  function readFileBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  (async () => {
    try {
      if (coverInput.files[0]) {
        const f = coverInput.files[0];
        const isImage = f.type.startsWith('image/');
        const isVideo = f.type.startsWith('video/');
        if (!isImage && !isVideo) {
          showToast('Cover harus gambar atau video!', 'error');
          return;
        }
        const maxSize = isImage ? 5 * 1024 * 1024 : 50 * 1024 * 1024;
        if (f.size > maxSize) {
          showToast(`Cover terlalu besar! Maks ${isImage ? '5MB' : '50MB'}`, 'error');
          return;
        }
        data.cover = {
          type: f.type,
          name: f.name,
          size: f.size,
          data: await readFileBase64(f)
        };
      }

      if (id) {
        updateItem('berita', id, data);
        showToast('Berita diperbarui!', 'success');
      } else {
        addItem('berita', data);
        showToast('Berita ditambahkan!', 'success');
      }
      closeModal();
      showPage('berita');
    } catch (err) {
      showToast('Gagal membaca file: ' + err.message, 'error');
    }
  })();
}

// KLUB ADMIN
function renderKlubAdmin() {
  const klub = getData('klub');
  return `
    <div class="admin-header">
      <h1>Kelola Klub Menembak</h1>
      <button class="btn btn-primary" onclick="formKlub()">+ Tambah Klub</button>
    </div>
    <table class="admin-table">
      <thead><tr><th>Inisial</th><th>Nama</th><th>Kabupaten</th><th>Atlet</th><th>Kategori</th><th>Status</th><th>Aksi</th></tr></thead>

function simpanKlub(id) {
  const data = {
    nama: document.getElementById('modal-nama').value,
    singkatan: document.getElementById('modal-singkatan').value,
    kabupaten: document.getElementById('modal-kabupaten').value,
    tahun: parseInt(document.getElementById('modal-tahun').value),
    atlet: parseInt(document.getElementById('modal-atlet').value),
    kategori: parseInt(document.getElementById('modal-kategori').value),
    status: document.getElementById('modal-status').value,
    deskripsi: document.getElementById('modal-deskripsi').value,
    pengurusDetail: document.getElementById('modal-pengurus-detail').value,
    atletDetail: document.getElementById('modal-atlet-detail').value,
    alamat: document.getElementById('modal-alamat').value,
    telp: document.getElementById('modal-telp').value,
    email: document.getElementById('modal-email').value,
    instagram: document.getElementById('modal-instagram').value,
    facebook: document.getElementById('modal-facebook').value,
    youtube: document.getElementById('modal-youtube').value
  };
  if (!data.nama || !data.singkatan) {
    showToast('Lengkapi field wajib!', 'error');
    return;
  }

  // Existing logo (untuk edit)
  const existing = id ? getData('klub').find(k => k.id === id) : null;
  data.logo = existing ? existing.logo : null;

  const logoInput = document.getElementById('modal-logo');
  function readFileBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  (async () => {
    try {
      if (logoInput.files[0]) {
        if (logoInput.files[0].size > 1 * 1024 * 1024) {
          showToast('Logo maksimal 1MB!', 'error');
          return;
        }
        data.logo = await readFileBase64(logoInput.files[0]);
      }
      if (id) {
        updateItem('klub', id, data);
        showToast('Klub diperbarui!', 'success');
      } else {
        addItem('klub', data);
        showToast('Klub ditambahkan!', 'success');
      }
      closeModal();
      showPage('klub');
    } catch (err) {
      showToast('Gagal membaca file: ' + err.message, 'error');
    }
  })();
}
  if (id) {
    updateItem('klub', id, data);
    showToast('Klub berhasil diperbarui!', 'success');
  } else {
    addItem('klub', data);
    showToast('Klub berhasil ditambahkan!', 'success');
  }
  closeModal();
  showPage('klub');
}

// Google Drive helpers
function parseGoogleDriveUrl(url) {
  if (!url) return null;
  // Format 1: https://drive.google.com/file/d/FILE_ID/view
  let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  // Format 2: https://drive.google.com/open?id=FILE_ID
  m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  // Format 3: https://drive.google.com/uc?id=FILE_ID&export=download
  m = url.match(/\/uc\?.*id=([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  return null;
}

function getGoogleDriveDirectUrl(url) {
  const id = parseGoogleDriveUrl(url);
  if (!id) return url;
  return `https://drive.google.com/uc?export=download&id=${id}`;
}

function previewDriveLink(input) {
  const target = document.getElementById('preview-drive');
  const url = input.value.trim();
  if (!url) {
    target.innerHTML = 'Paste link share Google Drive (pastikan sudah di-share "Siapa saja yang memiliki link")';
    return;
  }
  const id = parseGoogleDriveUrl(url);
  if (id) {
    target.innerHTML = `✅ <strong>Link valid</strong> — File ID: <code>${id}</code>`;
  } else {
    target.innerHTML = `⚠️ Format URL tidak dikenali. Pastikan link dari Google Drive (format: drive.google.com/file/d/...)`;
  }
}

  } else {
    target.innerHTML = '⚠️ Format tidak dikenali. Gunakan YouTube atau Google Drive saja.';
  }
}

// YouTube helpers
function parseYouTubeUrl(url) {
  if (!url) return null;
  let m = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = url.match(/\/embed\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  return null;
}

function getYouTubeEmbedUrl(url) {
  const id = parseYouTubeUrl(url);
  return id ? `https://www.youtube.com/embed/${id}` : url;

function simpanPengumuman(id) {
  const data = {
    judul: document.getElementById('modal-judul').value,
    tanggal: document.getElementById('modal-tanggal').value
  };
  if (!data.judul) { showToast('Lengkapi field!', 'error'); return; }

  // Existing data (untuk edit)
  const existing = id ? getData('pengumuman').find(p => p.id === id) : null;
  data.gambar = existing ? existing.gambar : null;
  data.pdf = existing ? existing.pdf : null;
  data.pdfName = existing ? existing.pdfName : null;
  data.driveLink = existing ? existing.driveLink : null;

  const gambarInput = document.getElementById('modal-gambar');
  const pdfInput = document.getElementById('modal-pdf');

  // Helper: read file as base64
  function readFileBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Save dengan async handling (FileReader)
  (async () => {
    try {
      if (gambarInput.files[0]) {
        if (gambarInput.files[0].size > 2 * 1024 * 1024) {
          showToast('Ukuran gambar maksimal 2MB!', 'error');
          return;
        }
        data.gambar = await readFileBase64(gambarInput.files[0]);
      }
      if (pdfInput.files[0]) {
        if (pdfInput.files[0].size > 100 * 1024 * 1024) {
          showToast('Ukuran PDF maksimal 100MB!', 'error');
          return;
        }
        data.pdf = await readFileBase64(pdfInput.files[0]);
        data.pdfName = pdfInput.files[0].name;
      }

      // Drive link (prioritas atas PDF upload)
      const driveInput = document.getElementById('modal-drive-link');
      if (driveInput) {
        const link = driveInput.value.trim();
        if (link) {
          if (parseGoogleDriveUrl(link)) {
            data.driveLink = link;
          } else {
            showToast('Format link Google Drive tidak valid!', 'error');
            return;
          }
        } else {
          data.driveLink = null;
        }
      }

      if (id) {
        updateItem('pengumuman', id, data);
        showToast('Pengumuman diperbarui!', 'success');
      } else {
        addItem('pengumuman', data);
        showToast('Pengumuman ditambahkan!', 'success');
      }
      closeModal();
      showPage('pengumuman');
    } catch (err) {
      showToast('Gagal membaca file: ' + err.message, 'error');
    }
  })();
}

function previewGaleriFiles(input) {
  const files = input.files;
  const preview = document.getElementById('preview-files');
  const info = document.getElementById('files-info');
  preview.innerHTML = '';
  if (!files.length) { info.textContent = ''; return; }

  if (files.length > 10) {
    showToast('Maksimal 10 file! Kelebihan file akan diabaikan.', 'error');
  }
  const valid = Array.from(files).slice(0, 10);

  valid.forEach((file, i) => {
    const isImage = file.type.startsWith('image/');
    const isVideo = file.type.startsWith('video/');
    if (!isImage && !isVideo) return;

    // Validate size
    const maxSize = isImage ? 5 * 1024 * 1024 : 50 * 1024 * 1024;
    if (file.size > maxSize) {
      showToast(`${file.name} terlalu besar!`, 'error');
      return;
    }

    const div = document.createElement('div');
    div.style.cssText = 'position: relative; aspect-ratio: 1; background: var(--bg); border-radius: 6px; overflow: hidden; border: 1px solid var(--line);';
    const reader = new FileReader();
    reader.onload = (e) => {
      if (isImage) {
        div.innerHTML = `<img src="${e.target.result}" style="width: 100%; height: 100%; object-fit: cover;">`;
      } else {
        div.innerHTML = `<video src="${e.target.result}" style="width: 100%; height: 100%; object-fit: cover;" muted></video><div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">▶</div>`;
      }
      div.innerHTML += `<div style="position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: #fff; font-size: 10px; padding: 2px 4px;">${isImage ? '📷' : '🎬'} ${(file.size/1024).toFixed(0)}KB</div>`;
    };
    reader.readAsDataURL(file);
    preview.appendChild(div);
  });

  info.innerHTML = `<strong>${valid.length} file</strong> dipilih (${isImageCount(valid)} foto, ${isVideoCount(valid)} video)`;
}

function isImageCount(files) { return Array.from(files).filter(f => f.type.startsWith('image/')).length; }
function isVideoCount(files) { return Array.from(files).filter(f => f.type.startsWith('video/')).length; }

function simpanGaleri(id) {
  const data = {
    judul: document.getElementById('modal-judul').value,
    tanggal: document.getElementById('modal-tanggal').value
  };
  if (!data.judul) { showToast('Lengkapi field!', 'error'); return; }

  // Existing data (untuk edit)
  const existing = id ? getData('galeri').find(g => g.id === id) : null;
  data.files = existing && existing.files ? existing.files : [];
  data.videoLink = existing && existing.videoLink ? existing.videoLink : null;

  const filesInput = document.getElementById('modal-files');
  const newFiles = filesInput.files ? Array.from(filesInput.files).slice(0, 10) : [];

  // Helper
  function readFileBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  (async () => {
    try {
      if (newFiles.length > 0) {
        // Validasi
        for (const f of newFiles) {
          const isImage = f.type.startsWith('image/');
          const isVideo = f.type.startsWith('video/');
          if (!isImage && !isVideo) {
            showToast(`Format ${f.name} tidak didukung!`, 'error');
            return;
          }
          const maxSize = isImage ? 5 * 1024 * 1024 : 50 * 1024 * 1024;
          if (f.size > maxSize) {
            showToast(`${f.name} terlalu besar! Maks ${isImage ? '5MB' : '50MB'}`, 'error');
            return;
          }
        }
        // Convert semua
        const fileEntries = await Promise.all(newFiles.map(async (f) => ({
          type: f.type,
          name: f.name,
          size: f.size,
          data: await readFileBase64(f)
        })));
        data.files = fileEntries;
        // Auto-kategori berdasarkan file pertama
        data.kategori = fileEntries[0].type.startsWith('image/') ? 'Foto' : 'Video';
      } else {
        // Edit tanpa upload: pakai kategori existing
        data.kategori = existing.kategori || 'Foto';
      }

      // Video link (YouTube / Google Drive)
      const videoInput = document.getElementById('modal-video-link');
      if (videoInput) {
        const link = videoInput.value.trim();
        if (link) {
          if (parseYouTubeUrl(link) || parseGoogleDriveUrl(link)) {
            data.videoLink = link;
            // Kalau gak ada file upload & ada link, set kategori ke Video
            if (newFiles.length === 0 && (!data.files || data.files.length === 0)) {
              data.kategori = 'Video';
            }
          } else {
            showToast('Format link video tidak valid (YouTube/Google Drive only)!', 'error');
            return;
          }
        } else {
          data.videoLink = null;
        }
      }

      if (id) {
        updateItem('galeri', id, data);
        showToast('Galeri diperbarui!', 'success');
      } else {
        addItem('galeri', data);
        showToast(`Galeri ditambahkan (${data.files.length} file)!`, 'success');
      }
      closeModal();
      showPage('galeri');
    } catch (err) {
      showToast('Gagal membaca file: ' + err.message, 'error');
    }
  })();
}

    </div>
  `;
}

function resetAll() {
  if (confirm('Yakin reset SEMUA data? Semua perubahan akan hilang dan kembali ke data awal.')) {
    if (confirm('Konfirmasi sekali lagi: RESET?')) {
      resetData();
      showToast('Data direset!', 'success');
      showPage('dashboard');
    }
  }
}

function hapusItem(key, id) {
  const label = { berita: 'berita', klub: 'klub', pengurus: 'pengurus', pengumuman: 'pengumuman', galeri: 'foto' }[key];
  if (confirm(`Hapus ${label} ini?`)) {
    deleteItem(key, id);
    showToast(`${label} berhasil dihapus`, 'success');
    showPage(currentPage);
  }
}
</script>
</body>
